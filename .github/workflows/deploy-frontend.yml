name: Deploy Frontend to cPanel

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build & Deploy Frontend
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 📦 Install Dependencies
        working-directory: frontend
        run: npm ci

      - name: 🏗️ Build Production Bundle
        working-directory: frontend
        env:
          VITE_API_URL: https://api-inventory.moderngebeya.com/api/v1
          VITE_API_BASE_URL: https://api-inventory.moderngebeya.com/api/v1
        run: npm run build

      - name: 🚀 Deploy to cPanel Subdomain via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./frontend/dist/
          server-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            **/.htaccess
            .htaccess
            **/.well-known/**
            .well-known/**
            **/cgi-bin/**
            cgi-bin/**
